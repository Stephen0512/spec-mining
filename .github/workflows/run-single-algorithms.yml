name: Run Single PyMop algorithm comparisons
on:
  workflow_call:
    inputs:
      project-link:
        required: true
        type: string
      release-name:
        required: true
        type: string
      original_d_d_libs_only:
        required: false
        type: boolean
        default: false
    secrets:
      GH_ACCESS_TOKEN:
        required: true

jobs:
  run-script:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJson(inputs.original_d_d_libs_only && '["run_original.sh","run_pymop_d.sh","run_pymop_d_libs.sh"]' || '["run_original.sh","run_pymop_b.sh","run_pymop_c.sh","run_pymop_c+.sh","run_pymop_d.sh","run_pymop_d_libs.sh","run_pymop_ast.sh","run_pymop_curse.sh","run_pymop_builtin.sh"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup variables
        run: |
            REPO_URL=$(echo "${{ inputs.project-link }}" | sed 's/;.*//')
            REPO_NAME="${REPO_URL##*/}"
            OWNER_NAME="${REPO_URL%/$REPO_NAME}"
            OWNER_NAME="${OWNER_NAME##*/}"
            FULL_REPO_NAME="$OWNER_NAME-$REPO_NAME"

            echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
            echo "FULL_REPO_NAME=$FULL_REPO_NAME" >> $GITHUB_ENV
            echo "REPO_URL=$REPO_URL" >> $GITHUB_ENV
        shell: bash

      - name: Prepare results dir
        run: |
          cd ./Algorithm_Experiment
          mkdir ./results

      - name: Install python3-tk and cloc
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk cloc

      - name: Run ${{ matrix.script }}
        run: |
          cd ./Algorithm_Experiment
          ls -l
          chmod +x ./${{ matrix.script }}
          bash ./${{ matrix.script }} "${{ inputs.project-link }}"
        env:
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Upload report to GitHub Release
        if: ${{ hashFiles('Algorithm_Experiment/*.zip') != '' }}
        uses: Wandalen/wretry.action@master
        with:
          attempt_delay: 60000
          attempt_limit: 10
          action: softprops/action-gh-release@v1
          with: |
            files: Algorithm_Experiment/*.zip
            tag_name: ${{ inputs.release-name }}
            name: ${{ inputs.release-name }}
            draft: false
            prerelease: true
            token: ${{ secrets.GITHUB_TOKEN }}
