name: Run Many PyMop algorithm comparisons

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      links_csv:
        description: 'Repo-relative path to a CSV (col A = GitHub URL, col B = SHA). If set, Google Sheets is skipped. Default is Algorithm_Experiment/links.csv.'
        required: false
        default: 'Algorithm_Experiment/links.csv'
      google_sheet_id:
        description: 'Optional Google Sheet ID. Used only when links_csv is empty. Share the sheet with mass-run-mop@mohas-filemap-cloud.iam.gserviceaccount.com as an editor.'
        required: false
        default: ''
      links_worksheetTitle:
        description: 'Sheet tab name. Used only when links_csv is empty. First column is repo URLs. Maximum 256 links.'
        required: false
        default: 'links-1'
      release_name:
        description: 'Name of the release to be created.'
        default: all-results-2024-05-18-morning
        required: true
      original_d_d_libs_only:
        description: 'If checked, only run run_original.sh and run_pymop_d.sh.'
        type: boolean
        default: false
        required: false
  # repository_dispatch:
  #   types: [run-multiple-repos]

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        if: ${{ !github.event.inputs.links_csv }}
        run: pip3 install pygsheets PyGithub

      - name: Prepare matrix
        id: set-matrix
        run: python3 scripts/get_repo_links.py
        env:
            LINKS_CSV: ${{ github.event.inputs.links_csv }}
            GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
            GOOGLE_SHEET_ID: ${{ github.event.inputs.google_sheet_id }}
            LINKS_TAB_NAME: ${{github.event.inputs.links_worksheetTitle}}

  run_jobs:
    needs: fetch_data
    uses: ./.github/workflows/run-single-algorithms.yml
    with:
      project-link: ${{ matrix.repo-link }}
      release-name: ${{ github.event.inputs.release_name }}
      original_d_d_libs_only: ${{ github.event.inputs.original_d_d_libs_only == 'true' }}
    secrets:
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        repo-link: ${{ fromJson(needs.fetch_data.outputs.matrix) }}
